version: '3.9'
services:
  mongo:
    image: mongo:7
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
  backend:
    build: ./backend
    ports:
      - "${BACKEND_PORT}:4000"
    environment:
      - MONGO_URL=${MONGO_URL}
    depends_on:
      - mongo
  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
    - backend
volumes:
 mongo-data: